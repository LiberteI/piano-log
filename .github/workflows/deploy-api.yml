name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'server/PianoLog.Api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: piano-logger-hfhfe8dxbhf5cgh2
  DOTNET_VERSION: 9.0.x
  PROJECT_PATH: server/PianoLog.Api/PianoLog.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish "$PROJECT_PATH" --configuration Release --output "$PUBLISH_PATH"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
